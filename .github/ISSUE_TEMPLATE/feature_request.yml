name: Preservation / access improvement suggestion
description: Suggest a change that improves Android access, compatibility, reliability, build/release quality or documentation without remastering the original game.
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        System Shock - Android is preservation-first. Stable releases keep the original game content and 4:3 presentation authoritative. Widescreen/Hor+, HD replacement assets, remastered fonts, gameplay changes and new content are outside the stable project scope.

  - type: textarea
    id: need
    attributes:
      label: Problem or access opportunity
      description: What Android access, compatibility, reliability or documentation problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the idea as concretely as possible.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Controls / input adaptation
        - Audio / timing compatibility
        - Android lifecycle / platform
        - Device compatibility
        - Build / reproducibility / release
        - Game-data import
        - Installation / accessibility
        - Documentation
        - Other preservation / access
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Fidelity or compatibility risks
      description: Explain any risk to original behavior, 4:3 presentation, data compatibility, existing installations or reproducibility.

  - type: textarea
    id: references
    attributes:
      label: References or examples
      description: Optional links, prior art or technical references.

  - type: checkboxes
    id: checks
    attributes:
      label: Project boundaries
      options:
        - label: This suggestion does not require redistributing proprietary System Shock game data.
          required: true
        - label: This suggestion is intended to preserve or improve access to the original game rather than remaster or redesign it.
          required: true
