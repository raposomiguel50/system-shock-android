name: Android compatibility report
description: Report successful or unsuccessful testing on an Android device.
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        Compatibility reports help build a device matrix beyond the Retroid Pocket 5 reference target. Successful reports are as useful as failures.

  - type: dropdown
    id: version
    attributes:
      label: Tested version
      options:
        - v0.1.0-pre.2
        - main
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Retroid Pocket 5
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 13
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: Controller or built-in controls
      description: State whether you used built-in controls, Bluetooth, USB or another controller.

  - type: dropdown
    id: build
    attributes:
      label: Build result
      options:
        - Pass
        - Fail
        - Used a build supplied by another tester
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install and launch
      options:
        - Pass
        - Partial
        - Fail
        - Not tested
    validations:
      required: true

  - type: textarea
    id: runtime
    attributes:
      label: Runtime checks
      description: Report display, controls, touchscreen, text input and audio separately where possible.
      placeholder: |
        Display: Pass / Fail / Not tested
        Controls: Pass / Fail / Not tested
        Touchscreen: Pass / Fail / Not tested
        Text input: Pass / Fail / Not tested
        Audio: Pass / Fail / Not tested
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes and evidence
      description: Add relevant logs, screenshots, hashes or device-specific observations. Do not attach proprietary game data.

  - type: checkboxes
    id: checks
    attributes:
      label: Data boundary
      options:
        - label: I supplied any required commercial game data separately from the public source and did not attach it here.
          required: true
