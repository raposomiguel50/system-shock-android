name: Android QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Fresh QA build and verification
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            AndroidProject/*.gradle
            AndroidProject/app/*.gradle
            AndroidProject/gradle/wrapper/gradle-wrapper.properties

      - name: Ensure pinned Android toolchain
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          if (-not $sdk) { throw 'Android SDK environment variable is not set.' }
          $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path -LiteralPath $sdkmanager -PathType Leaf)) { throw "sdkmanager not found: $sdkmanager" }
          & $sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed: $LASTEXITCODE" }

      - name: Install pinned PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery

      - name: Validate PowerShell scripts
        shell: pwsh
        run: ./scripts/lint-powershell.ps1 -RequirePSScriptAnalyzer

      - name: Bootstrap pinned public dependencies
        shell: pwsh
        run: ./scripts/bootstrap-deps.ps1

      - name: Build isolated QA variant
        shell: pwsh
        run: ./scripts/build.ps1 -Variant qa -JavaHome $env:JAVA_HOME

      - name: Verify QA APK
        shell: pwsh
        run: ./scripts/verify-apk.ps1 -Variant qa

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: system-shock-android-qa
          path: AndroidProject/app/build/outputs/apk/qa/app-qa.apk
          if-no-files-found: error
          retention-days: 7
